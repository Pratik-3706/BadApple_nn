<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadApple × NN - Watch a Neural Network Think</title>
    <meta name="description" content="A neural network generates Bad Apple frames live while you watch its internal activations in real-time.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ambient background glow -->
    <div class="ambient-glow ambient-glow--left"></div>
    <div class="ambient-glow ambient-glow--right"></div>

    <!-- header -->
    <header id="header">
        <div class="header-inner">
            <div class="header-brand">
                <div class="logo">
                    <span class="logo-icon">◉</span>
                    <h1>Bad<span class="text-thin">Apple</span> <span class="accent">×</span> <span class="text-bold">NN</span></h1>
                </div>
            </div>

            <div class="header-stats">
                <div class="stat-pill model-selector-pill">
                    <span class="stat-label">MODEL</span>
                    <select id="model-mode-select" class="model-select">
                        <option value="best">Best</option>
                        <option value="latest">Latest</option>
                        <option value="compare">Compare (Best vs Latest)</option>
                        <option value="compare_real_best">Compare (Best vs Real)</option>
                        <option value="compare_real_latest">Compare (Latest vs Real)</option>
                    </select>
                </div>
                <div class="stat-pill" id="status-pill">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">connecting</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">FPS</span>
                    <span class="stat-value" id="fps-display">-</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">INF</span>
                    <span class="stat-value" id="inference-display">- ms</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">NET</span>
                    <span class="stat-value" id="param-display">-</span>
                </div>
            </div>
        </div>
    </header>

    <!-- main content -->
    <main id="app">
        <!-- left: video player -->
        <section class="panel panel--video" id="video-panel">
            <div class="panel-label">
                <span class="panel-label-dot"></span>
                Neural Video Output
                <span class="model-tag" id="model-tag-main">BEST</span>
            </div>
            <div class="video-stage" id="video-stage">
                <div class="video-frame">
                    <canvas id="video-canvas"></canvas>
                    <div class="scanline"></div>
                </div>
                <!-- second canvas for comparison mode, hidden by default -->
                <div class="video-frame video-frame--compare" id="compare-frame" style="display:none">
                    <canvas id="video-canvas-compare"></canvas>
                    <div class="scanline"></div>
                </div>
                <!-- third frame for real video -->
                <div class="video-frame video-frame--compare" id="real-frame" style="display:none">
                    <video id="real-video" src="/api/video" muted playsinline style="width:100%; height:100%; object-fit:contain; display:block;"></video>
                    <div class="scanline"></div>
                </div>
                <div class="video-overlay">
                    <span class="frame-info" id="frame-counter">-</span>
                </div>
            </div>
            <!-- comparison labels that appear in compare mode -->
            <div class="compare-labels" id="compare-labels" style="display:none">
                <span class="compare-label compare-label--best">BEST</span>
                <span class="compare-label compare-label--latest">LATEST</span>
                <span class="compare-label compare-label--real">REAL</span>
            </div>
            <div class="transport">
                <button class="transport-btn" id="play-btn" title="Play / Pause (Space)">
                    <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" style="display:none">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <div class="seek-wrapper">
                    <input type="range" id="seek-bar" min="0" max="100" value="0" class="seek-bar">
                    <div class="seek-progress" id="seek-progress"></div>
                </div>
                <div class="transport-right">
                    <div class="fps-dial">
                        <label>SPD</label>
                        <input type="range" id="fps-slider" min="1" max="60" value="30" class="fps-slider">
                        <span id="fps-value">30</span>
                    </div>
                </div>
            </div>
            <audio id="audio-player" preload="auto">
                <source src="/api/audio" type="audio/mpeg">
            </audio>
        </section>

        <!-- right: network activations -->
        <section class="panel panel--network" id="network-panel">
            <div class="panel-label">
                <span class="panel-label-dot panel-label-dot--net"></span>
                Network Activations
            </div>
            <div class="network-stage" id="network-container">
                <canvas id="connections-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
                <canvas id="network-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
                <svg id="network-svg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></svg>
            </div>
            <div class="network-footer">
                <div class="colormap-legend">
                    <span class="legend-label">−1</span>
                    <div class="legend-bar"></div>
                    <span class="legend-label">+1</span>
                </div>
                <label class="proof-toggle">
                    <input type="checkbox" id="proof-mode-toggle">
                    <span class="proof-switch"></span>
                    <span class="proof-text">PROOF MODE</span>
                </label>
            </div>
        </section>
    </main>

    <!-- floating tooltip -->
    <div class="tooltip" id="neuron-tooltip">
        <div class="tooltip-header" id="tooltip-layer">layer_0</div>
        <div class="tooltip-row">
            <span class="tooltip-key">neuron</span>
            <span class="tooltip-val" id="tooltip-neuron">#0</span>
        </div>
        <div class="tooltip-row">
            <span class="tooltip-key">activation</span>
            <span class="tooltip-val tooltip-val--accent" id="tooltip-value">0.000000</span>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
